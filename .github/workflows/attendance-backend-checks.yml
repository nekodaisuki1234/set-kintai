name: Attendance backend checks
on:
  push:
    branches: [main, codex/paper-batch9]
    paths: ['backend/**', 'Makefile', '.github/workflows/attendance-backend-checks.yml', 'day-designs/paper-core.js', 'day-designs/paper-holidays.js', 'scripts/aws-*.py', 'scripts/bootstrap-aws.py', 'tests/security/**']
  pull_request:
    paths: ['backend/**', 'Makefile', '.github/workflows/attendance-backend-checks.yml', 'day-designs/paper-core.js', 'day-designs/paper-holidays.js', 'scripts/aws-*.py', 'scripts/bootstrap-aws.py', 'tests/security/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts
      - name: Audit backend dependencies
        run: npm audit --prefix backend --omit=dev --audit-level=moderate
      - name: Backend tests
        run: npm test --prefix backend
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: 1.171.0
      - name: Validate AWS templates
        run: |
          sam validate --lint --template-file backend/infra/deployment-bootstrap.yaml --region ap-northeast-1
          sam validate --lint --template-file backend/infra/template.yaml --region ap-northeast-1
      - name: Verify Lambda packaging
        run: sam build --template-file backend/infra/template.yaml

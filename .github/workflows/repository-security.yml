name: Repository security
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Private files and secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install checksum-pinned scanner
        run: |
          python3 scripts/security/install.py --destination "$RUNNER_TEMP/set-security-tools"
          echo "$RUNNER_TEMP/set-security-tools" >> "$GITHUB_PATH"
      - name: Check all tracked files and Git history
        run: python3 scripts/security/check.py
      - name: Verify rejection and deployment guards
        run: |
          python3 -m unittest discover -s tests/security -p 'test_*.py'
